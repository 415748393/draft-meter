  <rect x="200" y="132" width="196" height="6" rx="3" fill="#EDF1F8"/>

  <!-- composer card -->
  <rect x="72" y="156" width="496" height="96" rx="16" fill="url(#card)" stroke="#DCE3EF" stroke-width="1.5"/>
  <rect x="96" y="178" width="330" height="12" rx="6" fill="#E7ECF5"/>
  <rect x="96" y="202" width="248" height="12" rx="6" fill="#EDF1F8"/>
