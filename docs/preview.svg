<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F8FC"/>
      <stop offset="1" stop-color="#ECEFF7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFCFE"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A3550" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="300" fill="url(#bg)"/>

  <!-- the measurement panel, floating above the composer -->
  <rect x="184" y="26" width="272" height="118" rx="16" fill="#FFFFFF" filter="url(#lift)"/>
  <path d="M338 144h24l-12 9z" fill="#FFFFFF"/>
  <rect x="200" y="42" width="78" height="8" rx="4" fill="#7E8DA8"/>
